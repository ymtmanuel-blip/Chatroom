<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL_V21_FIXED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="bg-black text-green-500 font-mono flex flex-col h-screen p-4">
    
    <!-- Status-Anzeige -->
    <div class="text-[10px] mb-2 border border-green-900 p-2">
        <div>STATUS: <span id="status">INITIALIZING...</span></div>
        <div>ONLINE_USERS: <span id="count">0</span></div>
        <div>MY_ID: <span id="my-id">...</span></div>
        <div id="user-list">LISTE: </div>
    </div>

    <!-- Chat-Bereich (nimmt restlichen Platz ein) -->
    <div id="chat-box" class="flex-grow overflow-y-auto border border-green-900 p-2 text-xs mb-4">
        <div class="italic text-gray-600">-- SYSTEM: WARTE AUF NACHRICHTEN --</div>
    </div>

    <!-- Eingabefeld fest am Boden -->
    <div class="flex flex-col gap-2 border-t border-green-900 pt-2">
        <input id="chat-input" type="text" placeholder="NACHRICHT EINGEBEN..." 
               class="bg-black border border-green-900 p-3 text-xs w-full focus:outline-none focus:border-green-500">
        <button id="send-btn" class="border border-green-500 py-2 text-[10px] hover:bg-green-900">SENDEN</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAyRi9xLKRlJOTIWIz4-fNQR8hhQzNIkMo",
            authDomain: "randomchat-f26e7.firebaseapp.com",
            projectId: "randomchat-f26e7",
            storageBucket: "randomchat-f26e7.firebasestorage.app",
            messagingSenderId: "546523981303",
            appId: "1:546523981303:web:fdd0ad5eaf503f9a197af2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const input = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');

        signInAnonymously(auth).then(() => {
            document.getElementById('status').innerText = "ONLINE_READY";
            initPeer();
        }).catch(err => {
            document.getElementById('status').innerText = "AUTH_ERROR";
            console.error(err);
        });

        function initPeer() {
            const peer = new Peer();
            peer.on('open', id => {
                document.getElementById('my-id').innerText = id;
                setDoc(doc(db, 'online_users', id), { id: id, status: 'online' });
            });

            onSnapshot(collection(db, 'online_users'), (snap) => {
                document.getElementById('count').innerText = snap.size;
                const list = document.getElementById('user-list');
                list.innerHTML = "LISTE: ";
                snap.forEach(d => {
                    if(d.id !== peer.id) {
                        const btn = document.createElement("button");
                        btn.className = "border border-green-500 p-1 mx-1 text-[9px]";
                        btn.innerText = d.id;
                        list.appendChild(btn);
                    }
                });
            });
        }

        sendBtn.onclick = () => {
            if(input.value.trim()) {
                document.getElementById('chat-box').innerHTML += `<div>[ME]: ${input.value}</div>`;
                input.value = "";
            }
        };
    </script>
</body>
</html>
