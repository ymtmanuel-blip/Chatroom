<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL_P2P_PRO_MUTE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="bg-black text-green-500 font-mono flex flex-col h-screen p-4">

    <!-- Status & Input -->
    <div class="text-[10px] mb-2 border border-green-900 p-2 space-y-2">
        <div>STATUS: <span id="status">BEREIT</span></div>
        <div>DEINE_ID: <span id="my-id" class="font-bold text-lg">...</span></div>
        <div class="flex gap-2">
            <input id="peer-id-input" placeholder="PEER_ID EINGEBEN..." class="bg-black border border-green-900 p-1 w-full text-white">
            <button id="connect-btn" class="border border-green-500 px-2">VERBINDEN</button>
            <button id="call-btn" class="border border-green-500 px-2">ANRUF</button>
        </div>
    </div>

    <!-- Video Area -->
    <div id="video-box" class="hidden flex flex-col gap-2 mb-4">
        <video id="remote-video" autoplay class="w-full h-48 border border-green-900 object-cover"></video>
        <div class="flex gap-2 justify-center">
            <button id="mute-btn" class="border border-green-500 px-4 py-1 text-[10px]">MUTE_MIC</button>
            <button id="cam-btn" class="border border-green-500 px-4 py-1 text-[10px]">CAM_AUS</button>
        </div>
    </div>

    <!-- Chat -->
    <div id="chat-box" class="flex-grow overflow-y-auto border border-green-900 p-2 text-xs mb-4"></div>

    <div class="flex flex-col gap-2 border-t border-green-900 pt-2">
        <input id="chat-input" type="text" placeholder="NACHRICHT..." class="bg-black border border-green-900 p-3 text-xs w-full text-white">
        <button id="send-btn" class="border border-green-500 py-2 text-[10px]">SENDEN</button>
    </div>

    <script>
        const myIdSpan = document.getElementById('my-id');
        const statusSpan = document.getElementById('status');
        const chatBox = document.getElementById('chat-box');
        const peerIdInput = document.getElementById('peer-id-input');
        const remoteVideo = document.getElementById('remote-video');
        const videoBox = document.getElementById('video-box');
        
        let localStream;
        let isMuted = false;
        let isCamOff = false;

        const shortId = Math.floor(1000 + Math.random() * 9000).toString();
        const peer = new Peer(shortId); 
        let conn;

        peer.on('open', id => myIdSpan.innerText = id);

        peer.on('connection', (c) => {
            conn = c;
            conn.on('data', data => chatBox.innerHTML += `<div>[PEER]: ${data}</div>`);
        });

        peer.on('call', call => {
            navigator.mediaDevices.getUserMedia({video: true, audio: true}).then(stream => {
                localStream = stream;
                call.answer(stream);
                call.on('stream', remoteStream => {
                    videoBox.classList.remove('hidden');
                    remoteVideo.srcObject = remoteStream;
                });
            });
        });

        document.getElementById('connect-btn').onclick = () => {
            conn = peer.connect(peerIdInput.value.trim());
            conn.on('data', data => chatBox.innerHTML += `<div>[PEER]: ${data}</div>`);
        };

        document.getElementById('call-btn').onclick = () => {
            navigator.mediaDevices.getUserMedia({video: true, audio: true}).then(stream => {
                localStream = stream;
                const call = peer.call(peerIdInput.value.trim(), stream);
                call.on('stream', remoteStream => {
                    videoBox.classList.remove('hidden');
                    remoteVideo.srcObject = remoteStream;
                });
            });
        };

        // Mute & Cam Logik
        document.getElementById('mute-btn').onclick = () => {
            isMuted = !isMuted;
            localStream.getAudioTracks()[0].enabled = !isMuted;
            document.getElementById('mute-btn').innerText = isMuted ? "UNMUTE" : "MUTE_MIC";
        };

        document.getElementById('cam-btn').onclick = () => {
            isCamOff = !isCamOff;
            localStream.getVideoTracks()[0].enabled = !isCamOff;
            document.getElementById('cam-btn').innerText = isCamOff ? "CAM_AN" : "CAM_AUS";
        };

        document.getElementById('send-btn').onclick = () => {
            const input = document.getElementById('chat-input');
            if(conn && input.value) {
                conn.send(input.value);
                chatBox.innerHTML += `<div>[ME]: ${input.value}</div>`;
                input.value = "";
            }
        };
    </script>
</body>
</html>
